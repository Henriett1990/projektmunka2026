<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="index.css">

  <script src="bootstrap/jquery.min.js"></script>
  <script src="bootstrap/popper.min.js"></script>
  <script src="bootstrap/bootstrap.min.js"></script>
  <script src="admin.js"></script>

  <title>Admin felület</title>
</head>
<body>

<nav class="navbar navbar-expand-xl nav-hullamos navbar-light sticky-top felkover">
  <ul class="navbar-nav">
    <li class="nav-item">
      <a class="nav-link" href="Fooldal.html">Kezdőlap</a>
    </li>
    <li class="nav-item">
      <a class="nav-link" href="Termekek.html">Termékek</a>
    </li>
  </ul>
</nav>

<div class="container" style="margin-top: 30px;">

  <div id="login-panel">
  <h2 id="form-cim">Bejelentkezés</h2>

  <div id="register-fields" style="display: none;">
    <div class="form-group">
      <label>Felhasználónév</label>
      <input type="text" id="register-username" class="form-control">
    </div>
  </div>

  <div class="form-group">
    <label>Email</label>
    <input type="email" id="login-email" class="form-control">
  </div>
  <div class="form-group">
    <label>Jelszó</label>
    <input type="password" id="login-password" class="form-control">
  </div>

  <button id="login-gomb" class="btn-kosarba" onclick="handleLogin()">Bejelentkezés</button>
  <button id="register-gomb" class="btn btn-warning" onclick="handleRegister()" style="display: none;">Regisztráció</button>

  <p id="login-hiba" style="color: red;"></p>
  <p id="login-siker" style="color: green;"></p>

  <p>
    <a href="#" onclick="toggleFormMode(); return false;" id="mod-valto-link">Nincs még fiókod? Regisztrálj!</a>
  </p>
</div>

  <div id="admin-panel" style="display: none;">
    <h2>Termékek kezelése</h2>
    <p id="udvozles"></p>
    <button class="btn btn-secondary" onclick="handleLogout()">Kijelentkezés</button>

    <h3 style="margin-top: 30px;">Termék hozzáadása / módosítása</h3>
    <input type="hidden" id="termek-id">
    <div class="form-group">
      <label>Kategória</label>
      <input type="text" id="termek-category" class="form-control">
    </div>
    <div class="form-group">
      <label>Név</label>
      <input type="text" id="termek-name" class="form-control">
    </div>
    <div class="form-group">
      <label>Mennyiség/egység (pl. 150 ml)</label>
      <input type="text" id="termek-unit" class="form-control">
    </div>
    <div class="form-group">
      <label>Ár (Ft)</label>
      <input type="number" id="termek-price" class="form-control">
    </div>
    <div class="form-group">
      <label>Leírás</label>
      <textarea id="termek-description" class="form-control"></textarea>
    </div>
    <div class="form-group">
      <label>Kép elérési útja</label>
      <input type="text" id="termek-image" class="form-control">
    </div>
    <div class="form-group">
      <label>Készlet</label>
      <input type="number" id="termek-stock" class="form-control">
    </div>
    <button class="btn btn-warning" onclick="handleSaveProduct()">Mentés</button>
    <button class="btn btn-light" onclick="resetForm()">Új termék / Mégse</button>
    <p id="termek-uzenet"></p>

    <h3 style="margin-top: 30px;">Termékek listája</h3>
    <table class="table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Kategória</th>
          <th>Név</th>
          <th>Egység</th>
          <th>Ár</th>
          <th>Készlet</th>
          <th>Műveletek</th>
        </tr>
      </thead>
      <tbody id="termekek-tabla"></tbody>
    </table>
  </div>

  <div id="user-panel" style="display: none;">
    <h2>Fiókom</h2>
    <p id="user-udvozles"></p>
    <button class="btn btn-secondary" onclick="handleLogout()">Kijelentkezés</button>
    <p>Hamarosan itt fogod tudni megnézni a kosaradat és a korábbi rendeléseidet.</p>
  </div>

</div>

</body>
</html>
