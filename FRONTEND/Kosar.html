<div class="container" style="margin-top: 30px;">
  <h2 class="kosar-cim">Kosaram</h2>

  <div id="kosar-tartalom">
    <table class="table kosar-tablazat">
      <thead>
        <tr>
          <th>Termék</th>
          <th>Egységár</th>
          <th>Mennyiség</th>
          <th>Részösszeg</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="kosar-tabla"></tbody>
    </table>
    <h3 class="kosar-cim">Végösszeg: <span id="kosar-vegosszeg">0</span> Ft</h3>
    <p id="rendeles-uzenet" class="rendeles-uzenet-szoveg"></p>
    <button id="rendeles-gomb" class="btn-kosarba" onclick="rendelesLeadasa()">Rendelés leadása</button>
    <button id="bejelentkezes-gomb" class="gomb-vazlatos" style="display: none;" onclick="mutasdKosarBejelentkezes()">Bejelentkezés</button>

<div id="kosar-bejelentkezes" style="display: none; margin-top: 15px;">
  <div class="form-group">
    <label>Email</label>
    <input type="email" id="kosar-login-email" class="form-control">
  </div>
  <div class="form-group">
    <label>Jelszó</label>
    <input type="password" id="kosar-login-password" class="form-control" onkeypress="if (event.key === 'Enter') kosarBejelentkezes();">
  </div>
  <button class="btn-kosarba" onclick="kosarBejelentkezes()">Bejelentkezés</button>
  <p id="kosar-login-hiba" style="color: red;"></p>
</div>
  </div>

  <div id="rendeles-sikeres" style="display: none;">
    <p class="kosar-cim">Rendelésed sikeresen leadva, köszönjük a vásárlást!</p>
    <button class="btn-kosarba" onclick="window.location.href='Termekek.html'">Tovább vásárolok</button>
  </div>
